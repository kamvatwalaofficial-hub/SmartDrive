name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, tests, vulnerable packages)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore SmartDrive.slnx
      - name: Build
        run: dotnet build SmartDrive.slnx --no-restore -c Release -warnaserror
      - name: Unit tests
        run: dotnet test --project tests/SmartDrive.UnitTests --no-build -c Release
      - name: Integration tests
        run: dotnet test --project tests/SmartDrive.IntegrationTests --no-build -c Release
      - name: Check for vulnerable packages
        run: |
          dotnet list SmartDrive.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q -i "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  migrations:
    name: Migrations apply to SQL Server
    runs-on: ubuntu-latest
    needs: backend
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CI-Only-Password-123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CI-Only-Password-123 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      SMARTDRIVE_DESIGN_CONNECTION: Server=localhost,1433;Database=SmartDriveCi;User Id=sa;Password=CI-Only-Password-123;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.13
      - name: Fail if the model has changes without a migration
        run: dotnet ef migrations has-pending-model-changes --project src/SmartDrive.Application --startup-project src/SmartDrive.Api
      - name: Apply migrations
        run: dotnet ef database update --project src/SmartDrive.Application --startup-project src/SmartDrive.Api --connection "$SMARTDRIVE_DESIGN_CONNECTION"

  frontend:
    name: Frontend (lint, type-check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end smoke test and screenshots
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5080
      Database__Provider: Sqlite
      ConnectionStrings__SmartDrive: Data Source=/tmp/smartdrive-e2e.db
      Seed__AdminPassword: E2e-Admin-Pass-1
      Seed__CustomerPassword: E2e-Customer-Pass-1
      DEMO_ADMIN_PASSWORD: E2e-Admin-Pass-1
      DEMO_CUSTOMER_PASSWORD: E2e-Customer-Pass-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API (SQLite demo mode with sample data)
        working-directory: backend
        run: |
          dotnet build src/SmartDrive.Api -c Release
          nohup dotnet run --project src/SmartDrive.Api -c Release --no-build --no-launch-profile > ${{ runner.temp }}/api.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:5080/health && break; sleep 2; done
          curl -sf http://localhost:5080/health
      - name: Build and serve the frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npx vite preview --port 4173 --strictPort > ${{ runner.temp }}/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173 > /dev/null && break; sleep 1; done
      - name: Smoke test
        working-directory: frontend
        env:
          BASE_URL: http://localhost:4173
          SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: npm run e2e
      - name: API log
        if: failure()
        run: tail -n 200 ${{ runner.temp }}/api.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
