# Manually generates an EF Core migration on a runner and opens a pull request with it.
# Useful when no local .NET SDK is available.
name: Generate EF Core migration

on:
  workflow_dispatch:
    inputs:
      name:
        description: Migration name (PascalCase)
        required: true
        default: InitialCreate

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - run: dotnet tool install --global dotnet-ef --version 10.0.13
      - name: Add migration
        env:
          NAME: ${{ inputs.name }}
        run: |
          [[ "$NAME" =~ ^[A-Za-z][A-Za-z0-9]*$ ]] || { echo "Invalid name"; exit 1; }
          dotnet ef migrations add "$NAME" --project src/SmartDrive.Application --startup-project src/SmartDrive.Api --output-dir Data/Migrations
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}
        run: |
          branch="migrations/${NAME,,}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/SmartDrive.Application/Data/Migrations
          git commit -m "Add EF Core migration $NAME"
          git push origin "$branch"
          gh pr create --title "Add EF Core migration $NAME" --body "Generated by the 'Generate EF Core migration' workflow." --base main --head "$branch"
